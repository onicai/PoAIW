# Reproducible build configuration for Challenger canister
# Tool versions - update these when upgrading.
# MOC_VERSION must match the `[toolchain] moc` pin in ../mops.toml: that is what
# selects the compiler, and therefore the module hash.
x-versions:
  icp: &icp 1.2.0
  mops: &mops 2.13.2
  moc: &moc 1.4.1

x-base-image:
  # Base image naming convention: {repo}-build:icp-{version}-moc-{version}
  # (repo=PoAIW, lowercase for Docker)
  name: &base_name "poaiw-build:icp-1.2.0-moc-1.4.1"

services:
  base:
    build:
      context: ../../docker
      dockerfile: Dockerfile.base
      args:
        ICP_VERSION: *icp
        MOPS_VERSION: *mops
        MOC_VERSION: *moc
    image: *base_name
  # Image naming convention: {repo}-{canister_name}-wasm:latest (repo=PoAIW, lowercase for Docker)
  wasm:
    image: poaiw-challenger-ctrlb-canister-wasm:latest
    build:
      context: ../..
      dockerfile: Challenger/docker/Dockerfile
      args:
        IMAGE: *base_name
    volumes:
      - ../out:/app/Challenger/out
    command: bash scripts/build.sh
