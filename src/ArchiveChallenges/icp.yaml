# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.2.0/docs/schemas/icp-yaml-schema.json
#
# icp-cli project configuration. Replaces the legacy `dfx.json`, because dfx is deprecated.
#
# The @dfinity/motoko recipe compiles via `mops build archive_challenges_canister`, so the
# canister `name` below must exactly match the `[canisters.<name>]` key in mops.toml, and
# the moc version comes from mops.toml's `[toolchain]`.
#
# NOTE: `archive_challenges_canister_orig` (prd 474n2-qiaaa-aaaaf-qasoq-cai) is
# deliberately NOT declared here. It is the retired, classical-persistence predecessor;
# nothing in this repo rebuilds or redeploys it, and it is reached by principal.

canisters:
  - name: archive_challenges_canister
    recipe:
      type: '@dfinity/motoko@v5.0.0'
      configuration:
        # Pinned explicitly rather than inherited: shrink defaults to OFF, and turning it
        # on changes the module hash, so it must be a property of this repo rather than of
        # whichever recipe version happens to resolve.
        shrink: true

networks:
  # A project-local replica, started with `icp network start`. icp-cli runs one local
  # network per project (keyed by project root), so this does not collide with the
  # replicas of the other canister projects in this repo, or of other worktrees.
  #
  # `port: 0` lets the OS assign a free ephemeral port, so parallel projects cannot fight
  # over the default 8000 either. The port therefore changes on every start: never
  # hardcode it, read it back with `icp network status -e local --json`.
  - name: local
    mode: managed
    gateway:
      port: 0

environments:
  # `--network <env>` in the Makefiles, scripts and pytest now names one of these.
  #
  # These names were dfx "networks" that ALL pointed at https://icp0.io, i.e. they were
  # never separate networks -- only separate canister-id namespaces. Under icp-cli that is
  # exactly what an environment is, so each gets its own
  # .icp/data/mappings/<env>.ids.json. `prd` is this project's mainnet convention.
  - name: local
    network: local
  - name: prd
    network: ic
  - name: testing
    network: ic
  - name: development
    network: ic
  - name: demo
    network: ic
  - name: backup
    network: ic
