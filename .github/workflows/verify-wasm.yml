name: verify-wasm

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to verify against"
        type: choice
        options:
          - prd
          - testing
          - development
        default: prd

env:
  # Keep in sync with the x-versions block in each src/*/docker/docker-compose.yml.
  ICP_VERSION: "1.2.0"
  MOPS_VERSION: "2.13.2"
  MOC_VERSION: "1.4.1"
  DO_NOT_TRACK: "1"

jobs:
  verify-wasm:
    name: verify-wasm ${{ matrix.canister }} (${{ inputs.network }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - canister: Api
            canister_name: api_canister
          - canister: mAInerCreator
            canister_name: mainer_creator_canister
          - canister: ArchiveChallenges
            canister_name: archive_challenges_canister
          - canister: Challenger
            canister_name: challenger_ctrlb_canister
          - canister: Judge
            canister_name: judge_ctrlb_canister
          - canister: mAIner
            canister_name: mainer_service_canister
          - canister: Treasury
            canister_name: funnai_treasury_canister
          - canister: GameState
            canister_name: game_state_canister
          - canister: ckSigner
            canister_name: ck_signer_canister

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The icp-cli binary links against libdbus/libssl.
      - name: install icp-cli system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-3 libssl3 ca-certificates

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install icp-cli
        run: npm install -g "@icp-sdk/icp-cli@$ICP_VERSION" "@icp-sdk/ic-wasm"

      # No identity is needed: `icp canister status <id> -n ic -p` reads the public state
      # tree, so the hash lookup works without being a controller.

      - name: versions
        run: |
          echo "Runner OS   : $RUNNER_OS"
          echo "Architecture: $(uname -m)"
          echo "OS version  : $(lsb_release -d 2>/dev/null | cut -f2)"
          echo "icp version : $(icp --version)"
          echo "Docker      : $(docker --version)"

      - name: clean docker build cache
        run: docker builder prune --all --force

      - name: build Docker base image
        working-directory: src/${{ matrix.canister }}
        run: make docker-build-base

      - name: build wasm with Docker
        working-directory: src/${{ matrix.canister }}
        run: make docker-build-wasm

      # EXPECTED TO FAIL until each canister is redeployed with an icp-built wasm.
      # The dfx -> icp-cli migration changed the build chain (moc now comes from
      # mops.toml, and ic-wasm shrink rewrites the element section), so every hash moved.
      # Redeploying is a separate project -- see WASM-HASHES.md, which tracks the new
      # expected hash and the not-yet-redeployed state per canister.
      - name: verify wasm hash matches deployed canister
        working-directory: src/${{ matrix.canister }}
        run: make docker-verify-wasm VERIFY_NETWORK=${{ inputs.network }}
