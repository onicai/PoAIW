name: cicd-ubuntu

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cicd-ubuntu.yml"
      - ".github/workflows/trigger.txt"
      # Pins the icpp-pro version the smoketests run on, so it decides whether
      # this workflow passes and must be able to trigger it.
      - "requirements.txt"
      # Keep in sync with matrix.canister below
      - "src/Api/**"
      - "src/mAIner/**"
      - "src/ArchiveChallenges/**"
      - "src/Challenger/**"
      - "src/GameState/**"
      - "src/Judge/**"
      - "src/mAInerCreator/**"
      - "src/Treasury/**"
      - "src/ckSigner/**"
      - "src/common/**"
      - "src/docker/**"

env:
  # Keep in sync with the x-versions block in each src/*/docker/docker-compose.yml.
  ICP_VERSION: "1.2.0"
  MOPS_VERSION: "2.13.2"
  MOC_VERSION: "1.4.1"
  # `icp network start` downloads the network-launcher through the GitHub API.
  # Unauthenticated that is 60 requests/hour shared across ALL GitHub-hosted runners, so a
  # 9-way matrix fails at random with "403 rate limit exceeded". This token lifts it.
  ICP_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Keep CI runs out of the usage telemetry.
  DO_NOT_TRACK: "1"

jobs:
  reproducible-build:
    name: reproducible-build ${{ matrix.canister }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with on.push.paths above
        include:
          - canister: Api
            canister_name: api_canister
          - canister: ArchiveChallenges
            canister_name: archive_challenges_canister
          - canister: Challenger
            canister_name: challenger_ctrlb_canister
          - canister: GameState
            canister_name: game_state_canister
          - canister: Judge
            canister_name: judge_ctrlb_canister
          - canister: mAIner
            canister_name: mainer_service_canister
          - canister: mAInerCreator
            canister_name: mainer_creator_canister
          - canister: Treasury
            canister_name: funnai_treasury_canister
          - canister: ckSigner
            canister_name: ck_signer_canister

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: docker versions
        run: |
          echo "Runner OS   : $RUNNER_OS"
          echo "Architecture: $(uname -m)"
          echo "OS version  : $(lsb_release -d 2>/dev/null | cut -f2)"
          echo "Docker      : $(docker --version)"

      - name: clean docker build cache
        run: docker builder prune --all --force

      - name: build Docker base image
        working-directory: src/${{ matrix.canister }}
        run: make docker-build-base

      - name: build wasm with Docker (reproducible build)
        working-directory: src/${{ matrix.canister }}
        run: make docker-build-wasm

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Node >= 22 is required by icp-cli and the official canister recipes.
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The icp-cli binary links against libdbus/libssl; without them it fails at startup
      # with "libdbus-1.so.3: cannot open shared object file".
      - name: install icp-cli system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-3 libssl3 ca-certificates

      - name: install icp-cli, ic-wasm and mops
        run: |
          set -euo pipefail
          npm install -g "@icp-sdk/icp-cli@$ICP_VERSION" "@icp-sdk/ic-wasm" "ic-mops@$MOPS_VERSION"

      # The identity the smoke tests deploy and assert as. Each Makefile exports
      # ICPP_PRO_TEST_IDENTITY=funnAI-local, which icpp-pro 6.0.0 reads; it never touches
      # the machine-wide active identity, so nothing here needs `icp identity default`.
      # `--storage plaintext` is required: a keyring identity makes `icp identity export`
      # prompt for a password and hang the run.
      - name: create the test identity
        run: |
          icp identity new funnAI-local --storage plaintext 2>/dev/null || true

      - name: install python dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: smoketest versions
        run: |
          echo "icp version   : $(icp --version)"
          echo "mops version  : $(mops --version)"
          echo "pip version   : $(pip --version)"
          echo "python version: $(python --version)"
          echo "pytest version: $(pytest --version)"

      - name: smoketest ${{ matrix.canister }} canister
        working-directory: src/${{ matrix.canister }}
        run: |
          set -euo pipefail
          mops toolchain use moc "$MOC_VERSION"
          mops install
          make smoketest
